name: Isengard Industries Inc
description: >-
  Isengard Industries builds sovereign production capability for defense: the
  means for allied nations to manufacture precision-strike and counter-drone
  (counter-UAS) systems by the thousand, on their own soil, at a fraction of what
  traditional prime contractors charge. The company describes its approach as
  "Weapons of Mass Production." Founded in 2026 and part of Y Combinator's Summer
  2026 batch, it is led by Francisco Serra-Martins (previously co-founder/CEO of
  Terminal Autonomy) and James Tennant (former Australian Army officer), and is
  headquartered in San Francisco. As a hardware and defense-manufacturing company
  it does not currently publish a public developer API, SDKs, or API
  documentation; this profile captures its public identity and security surface
  for the API Evangelist network.
